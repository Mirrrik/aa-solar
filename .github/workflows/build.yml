name: Android build and solar tests
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - LICENSE
      - 'licenses/**'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK platform
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - name: Build and lint
        run: |
          sed -i 's/\r$//' gradlew
          bash ./gradlew --no-daemon :app:assembleRelease :app:lintRelease
      - name: Test solar calculations
        run: |
          mkdir -p build/solar-tests
          javac -encoding UTF-8 -d build/solar-tests app/src/main/java/sk/octavia/aasolar/SunTimes.java tests/SunTimesTest.java
          java -cp build/solar-tests SunTimesTest
      - uses: actions/upload-artifact@v7
        with:
          name: aa-solar-unsigned-release
          path: app/build/outputs/apk/release/app-release-unsigned.apk

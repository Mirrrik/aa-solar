name: Android build and solar tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK platform
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build and lint
        run: bash ./gradlew --no-daemon :app:assembleRelease :app:lintRelease
      - name: Test solar calculations
        run: |
          mkdir -p build/solar-tests
          javac -encoding UTF-8 -d build/solar-tests app/src/main/java/sk/octavia/aasolar/SunTimes.java tests/SunTimesTest.java
          java -cp build/solar-tests SunTimesTest
      - uses: actions/upload-artifact@v4
        with:
          name: aa-solar-unsigned-release
          path: app/build/outputs/apk/release/app-release-unsigned.apk
